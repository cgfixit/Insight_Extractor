name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Suppress HuggingFace/transformers progress bars and telemetry in CI
  TRANSFORMERS_VERBOSITY: error
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint & format check  (fast gate — no model download)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install --upgrade ruff

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format (check only)
        run: ruff format --check src/ tests/

  # ---------------------------------------------------------------------------
  # 2. Type checking  (fast gate — no model download)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: mypy strict
        run: mypy src/insight_extractor

  # ---------------------------------------------------------------------------
  # 3. Unit tests  (no sentence-transformers model needed)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=insight_extractor \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit-unit-${{ matrix.python-version }}.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-py${{ matrix.python-version }}
          path: junit-unit-${{ matrix.python-version }}.xml

  # ---------------------------------------------------------------------------
  # 4. CLI smoke test — runs production orchestration against a real local file.
  #    Only the external BERT boundary is replaced with deterministic test doubles.
  # ---------------------------------------------------------------------------
  smoke-test:
    name: CLI Smoke (Python 3.12 + local .txt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package (runtime deps only)
        run: pip install -e .

      - name: Generate isolated local text file
        env:
          SMOKE_DIR: ${{ runner.temp }}/insight-smoke
        run: |
          mkdir -p "$SMOKE_DIR"
          cat > "$SMOKE_DIR/local report 2026.txt" << 'EOF'
          On May 11 2026, the Nitrogen ransomware group claimed to have stolen 8 terabytes
          of data from Foxconn North American facilities in Mount Pleasant, Wisconsin.
          The group exploited CVE-2026-12345 in the Starlette ASGI framework to gain
          initial access via a server-side request forgery (SSRF) vulnerability.
          A SHA-256 hash 3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c
          was observed in memory dumps across 14 VMware ESXi hosts.
          Conti 2 builder code was repurposed to generate an ESXi locker.
          Lateral movement was achieved via pass-the-hash and Kerberoasting.
          Contact: ransom@darkmail.onion | BTC wallet: 1A1zP1eP5QGefi2DMPTfTL5SLmv7Divf8C
          Affected IP: 192.168.1.254  Port: 4444
          Data exfiltrated: 8 TB over 72 hours before encryption.
          CVE-2026-48710 affects millions of AI agent pipelines using LangChain and ChromaDB.
          OSINT recon via Shodan, Censys, and Google dorking revealed exposed admin panels.
          The threat actor also leveraged BERT embeddings and RAG pipelines for C2 comms.
          Mycorrhizal mycorrhizal mycorrhizal telemetry improved the forest ecology survey.
          EOF

      - name: Run production CLI orchestration and validate output
        env:
          HF_HUB_OFFLINE: "1"
          SMOKE_DIR: ${{ runner.temp }}/insight-smoke
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python - << 'PYEOF'
          import contextlib
          import io
          import json
          import os
          import shutil
          import sys
          from pathlib import Path

          import numpy as np

          import insight_extractor.__main__ as cli
          from insight_extractor.extractor import InsightExtractor


          class SmokeModel:
              def encode(self, texts, *_args, **_kwargs):
                  items = [texts] if isinstance(texts, str) else list(texts)
                  return np.array(
                      [[float(index), 1.0, 0.5, 0.25] for index, _ in enumerate(items, 1)],
                      dtype=np.float64,
                  )


          class SmokeTokenizer:
              def tokenize_sentences(self, text, *, max_tokens=512):
                  del max_tokens
                  return [part.strip() for part in text.split(".") if len(part.strip()) > 10]


          class SmokeExtractor(InsightExtractor):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self._model = SmokeModel()
                  self._tokenizer = SmokeTokenizer()


          assert sys.version_info[:2] == (3, 12), sys.version
          assert shutil.which("insight-extract"), "installed console entry point is missing"

          run_dir = Path(os.environ["SMOKE_DIR"])
          input_path = run_dir / "local report 2026.txt"
          os.chdir(run_dir)
          cli.InsightExtractor = SmokeExtractor
          sys.argv = ["insight-extract", str(input_path)]

          captured = io.StringIO()
          with contextlib.redirect_stdout(captured):
              cli.main()
          console = captured.getvalue()
          (run_dir / "console.txt").write_text(console, encoding="utf-8")
          print(console)

          console_sections = (
              "=== REGEX ENTITIES ===",
              "=== DYNAMIC KEYWORD MATCHES ===",
              "=== SEMANTIC KEYWORD HITS (top 10) ===",
              "=== KEY SENTENCES ===",
              "=== DYNAMIC EXPANSION:",
              "Total tracked keywords:",
              "=== KEYWORD STATS ===",
          )
          report_sections = (
              "# Insight Extraction Results",
              "## Regex Entities",
              "## Dynamic Keyword Matches",
              "## Semantic Keywords",
              "## Key Sentences",
              "## Newly Expanded Keywords",
              "## Keyword Statistics",
          )

          report_path = run_dir / "insights_extracted.md"
          state_path = run_dir / "insight_extractor_state.json"
          report = report_path.read_text(encoding="utf-8")
          state = json.loads(state_path.read_text(encoding="utf-8"))

          assert all(console.count(section) == 1 for section in console_sections), console
          console_positions = [console.index(section) for section in console_sections]
          assert console_positions == sorted(console_positions), console_positions
          semantic_output = console.split(console_sections[2], 1)[1].split(console_sections[3], 1)[0]
          assert semantic_output.count("\n  [") == 10, semantic_output
          positions = [report.index(section) for section in report_sections]
          assert positions == sorted(positions), positions
          semantic_report = report.split(report_sections[3], 1)[1].split(report_sections[4], 1)[0]
          assert semantic_report.count("\n| ") > 11, semantic_report
          assert "CVE-2026-12345" in console and "CVE\\-2026\\-12345" in report
          assert "192.168.1.254" in console and "192\\.168\\.1\\.254" in report
          assert "ransom@darkmail.onion" in console and "ransom@darkmail\\.onion" in report
          assert "| Keyword | Score | Context |" in report
          assert "| Score | Sentence |" in report
          assert "Results saved to: insights_extracted.md" in console
          assert state["version"] == 1
          assert any("mycorrhizal" in keyword.lower() for keyword in state["thread_keywords"])

          print("[SMOKE PASS] Python 3.12 real-file CLI output is structured and complete.")
          print(f"  Console lines: {len(console.splitlines())}")
          print(f"  Markdown lines: {len(report.splitlines())}")
          print(f"  Tracked keywords: {len(state['thread_keywords'])}")
          PYEOF

      - name: Upload user-visible smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-output
          path: ${{ runner.temp }}/insight-smoke
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. Integration tests  (optional — heavy; skipped unless manually triggered
  #    or on a schedule, to avoid downloading BERT weights on every push)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests (full BERT pipeline)
    runs-on: ubuntu-latest
    # Run on manual dispatch, schedule, or when [run-integration] in commit msg
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[run-integration]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-all-MiniLM-L6-v2-${{ runner.os }}
          restore-keys: hf-models-

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            --junitxml=junit-integration.xml

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: junit-integration.xml

  # ---------------------------------------------------------------------------
  # 6. Required status check gate
  # ---------------------------------------------------------------------------
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, smoke-test]
    if: always()
    steps:
      - name: All required jobs passed
        run: |
          if [[ "${{ needs.lint.result }}"        != "success" ||
                "${{ needs.typecheck.result }}"   != "success" ||
                "${{ needs.unit-tests.result }}"  != "success" ||
                "${{ needs.smoke-test.result }}"  != "success" ]]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
